name: Windows Prototype
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          cp templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - name: Export Windows EXE
        run: |
          mkdir -p dist
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --import 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" godot-import.log; then echo "Godot import errors detected"; exit 1; fi
          timeout 15s ./Godot_v4.3-stable_linux.x86_64 --headless --path . --quit-after 3 2>&1 | tee godot-startup.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" godot-startup.log; then echo "Godot startup errors detected"; exit 1; fi
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" dist/AmericanGladiatorsUltimateEdition.exe
          test -s dist/AmericanGladiatorsUltimateEdition.exe
      - uses: actions/upload-artifact@v4
        with:
          name: American-Gladiators-UE-Windows
          path: dist/*
